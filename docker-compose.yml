# AutoFlow — local development stack.
# Run everything:   docker compose up
# DB only:          docker compose up postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoflow-postgres
    environment:
      POSTGRES_USER: autoflow
      POSTGRES_PASSWORD: autoflow
      POSTGRES_DB: autoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: autoflow-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: local
      POSTGRES_DATABASE_URL: postgresql+asyncpg://autoflow:autoflow@postgres:5432/autoflow
      JWT_SECRET_KEY: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: autoflow-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
